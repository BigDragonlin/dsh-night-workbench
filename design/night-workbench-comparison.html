<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜间工作台界面对比</title>
<style>
body { margin: 32px auto; padding: 0 16px; max-width: 1320px; font: 16px/1.5 system-ui, sans-serif; }
figure { margin: 0 0 28px; }
figcaption { margin-bottom: 8px; }
.capture { position: relative; width: 100%; max-width: var(--width); }
img { display: block; width: 100%; height: auto; }
.mark { position: absolute; left: .15%; top: 18.65%; width: 11.4%; height: 3.05%; border: 2px solid #ff6565; border-radius: 50%; box-sizing: border-box; pointer-events: none; }
</style>
<h1>夜间工作台界面对比</h1>
<figure>
  <figcaption>安装前 · 左侧栏收起，自动化任务后面紧接着「更多」。</figcaption>
  <div class="capture" style="--width:1010px"><img src="night-workbench-before.png" alt="安装前的 DSH 页面"></div>
</figure>
<figure>
  <figcaption>安装后 · 红圈标出新增入口。点击后，右侧显示空白工作台。</figcaption>
  <div class="capture" style="--width:2368px"><img src="night-workbench-after.png" alt="打开夜间工作台后的 DSH 页面"><span class="mark" aria-hidden="true"></span></div>
</figure>
</html>
